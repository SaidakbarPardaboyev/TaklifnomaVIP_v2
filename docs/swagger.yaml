basePath: /
definitions:
  contracts.AccountContract:
    properties:
      id:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  contracts.InvitationInfoContract:
    properties:
      address:
        type: string
      bride_fullname:
        type: string
      description:
        type: string
      event_date:
        type: string
      event_time:
        type: string
      groom_fullname:
        type: string
      images:
        items:
          type: string
        type: array
      location:
        type: string
      main_image:
        type: string
      music:
        type: string
      partners_names:
        type: string
      story:
        type: string
      title:
        type: string
      venue_name:
        type: string
    type: object
  contracts.OrderContract:
    properties:
      account_id:
        type: string
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      invitation_info:
        $ref: '#/definitions/contracts.InvitationInfoContract'
      price:
        type: number
      status:
        type: string
      template_code:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  contracts.PaymentLinkContract:
    properties:
      link:
        type: string
    type: object
  contracts.TransactionContract:
    properties:
      account_id:
        type: string
      amount:
        type: number
      cancel_time:
        type: integer
      created_time:
        type: integer
      id:
        type: string
      order_id:
        type: string
      payment_id:
        type: string
      perform_time:
        type: integer
      reason:
        type: integer
      state:
        type: integer
    type: object
  requestmodels.CreateOrderRequest:
    properties:
      invitation_info:
        $ref: '#/definitions/requestmodels.InvitationInfoRequest'
      template_code:
        type: string
    type: object
  requestmodels.GeneratePaymeLinkRequest:
    properties:
      amount:
        type: number
      order_id:
        type: string
    type: object
  requestmodels.InvitationInfoRequest:
    properties:
      address:
        type: string
      bride_fullname:
        type: string
      description:
        type: string
      event_date:
        type: string
      event_time:
        type: string
      groom_fullname:
        type: string
      images:
        items:
          type: string
        type: array
      location:
        type: string
      main_image:
        type: string
      music:
        type: string
      partners_names:
        type: string
      story:
        type: string
      title:
        type: string
      venue_name:
        type: string
    type: object
  requestmodels.UpdateAccountRequest:
    properties:
      full_name:
        type: string
    type: object
  requestmodels.UpdateOrderRequest:
    properties:
      invitation_info:
        $ref: '#/definitions/requestmodels.InvitationInfoRequest'
    type: object
  requestmodels.VerifyCodeRequest:
    properties:
      code:
        type: string
      phone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Wedding invitation platform API
  title: TaklifnomaVIP API
  version: "1.0"
paths:
  /account/verify-code:
    post:
      consumes:
      - application/json
      description: Submit the phone number and OTP code received via Telegram bot
        to get a bearer token
      parameters:
      - description: Phone and OTP code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestmodels.VerifyCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify OTP code
      tags:
      - Account
  /api/account/get-me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contracts.AccountContract'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current account
      tags:
      - Account
  /api/account/update-me:
    put:
      consumes:
      - application/json
      parameters:
      - description: Account update info
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestmodels.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contracts.AccountContract'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current account
      tags:
      - Account
  /api/order/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Order creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestmodels.CreateOrderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/contracts.OrderContract'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new order
      tags:
      - Order
  /api/order/delete/{id}:
    delete:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancel/delete a draft order
      tags:
      - Order
  /api/order/get/{id}:
    get:
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contracts.OrderContract'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get order by ID
      tags:
      - Order
  /api/order/list:
    get:
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by template code
        in: query
        name: template_code
        type: string
      - description: Filter from date (RFC3339)
        in: query
        name: from_date
        type: string
      - description: Filter to date (RFC3339)
        in: query
        name: to_date
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Sort field
        in: query
        name: sort_by
        type: string
      - description: Sort direction (asc/desc)
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/contracts.OrderContract'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List orders for current account
      tags:
      - Order
  /api/order/update/{id}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: string
      - description: Order update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestmodels.UpdateOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contracts.OrderContract'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a draft order
      tags:
      - Order
  /api/payment/generate-link:
    post:
      consumes:
      - application/json
      parameters:
      - description: Order ID and amount
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requestmodels.GeneratePaymeLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contracts.PaymentLinkContract'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Generate a Payme payment link for an order
      tags:
      - Payment
  /api/transaction/get/{order_id}:
    get:
      parameters:
      - description: Order ID
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contracts.TransactionContract'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get transaction by order ID
      tags:
      - Transaction
  /api/transaction/list:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/contracts.TransactionContract'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List transactions for current account
      tags:
      - Transaction
  /payme:
    post:
      consumes:
      - application/json
      description: 'Handles Payme JSON-RPC calls: CheckPerformTransaction, CreateTransaction,
        PerformTransaction, CancelTransaction, CheckTransaction, GetStatement'
      parameters:
      - description: Payme JSON-RPC request
        in: body
        name: body
        required: true
        schema:
          properties:
            method:
              type: string
            params:
              type: object
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Payme payment gateway webhook
      tags:
      - Payment
  /public/i/{id}:
    get:
      description: Returns the invitation details and increments view count. No authentication
        required.
      parameters:
      - description: Invitation ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/contracts.OrderContract'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get public invitation by ID
      tags:
      - Invitation
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
